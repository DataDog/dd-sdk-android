include:
  - 'https://gitlab-templates.ddbuild.io/slack-notifier/v3-sdm/template.yml'

# SETUP

default:
  interruptible: true # default all jobs to be interruptable

workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH !~ /^(develop|master)$|^feature\//"
      auto_cancel:
        on_new_commit: interruptible # short-lived branches cancel on new commits
    - when: always # develop, master, feature/*, tags: never auto-canceled

stages:
  - ci-image
  - security
  - analysis
  - test # TODO RUM-1622 cleanup eventually
  - test-pyramid
  - publish
  - notify

.snippets:
  source-secrets:
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  source-secrets-macos:
    - vault login -method=aws -no-print
    - export DD_ANDROID_SECRETS_PATH_PREFIX="kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-android/"
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  setup-dd-tracer:
    - export DD_TRACER_FOLDER="$HOME/dd-java-agent"
    - mkdir -p "$DD_TRACER_FOLDER"
    - curl -Lo "$DD_TRACER_FOLDER/dd-java-agent.jar" https://dtdg.co/latest-java-tracer
    - export DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__API_KEY)
    - export DD_CIVISIBILITY_AGENTLESS_ENABLED=true

  setup-dd-ci-cli:
    - npm install -g @datadog/datadog-ci
    - export DATADOG_API_KEY=$(get_secret $DD_ANDROID_SECRET__API_KEY)

  setup-gradle:
    - export GRADLE_USER_HOME="cache/"
    - echo "org.gradle.jvmargs=-Xmx4096m -javaagent:$DD_TRACER_FOLDER/dd-java-agent.jar=$DD_COMMON_AGENT_CONFIG" >> gradle.properties
    # Set max workers to keep memory under control
    - echo "org.gradle.workers.max=4" >> gradle.properties
    # Disable cache clean up if we won't upload the cache anywhere
    - echo "org.gradle.cache.cleanup=$( [[ "$GRADLE_CACHE_CLEANUP" == "true" ]] && echo "always" || echo "disabled" )" >> gradle.properties
    # Equal to --stacktrace
    - echo "org.gradle.logging.stacktrace=all" >> gradle.properties
    # Keep kotlin compiler in Gradle daemon process for more predictable memory
    - echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
    - echo "--- gradle.properties ---" && cat gradle.properties

  # macOS AMI will already have cmdline-tools installed
  install-android-api-components:
    - echo y | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --install "emulator"
    - echo y | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
    - echo y | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --install "$ANDROID_PLATFORM"
    - echo y | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --install "$ANDROID_BUILD_TOOLS"
    - echo y | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --install "$ANDROID_EMULATOR_IMAGE"
    - yes | ~/android_sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - echo "no" | ~/android_sdk/cmdline-tools/latest/bin/avdmanager --verbose create avd --force --name "$EMULATOR_NAME" --package "$ANDROID_EMULATOR_IMAGE"
    - |
      echo "=== HVF diagnostics (RUM-16470) ==="
      echo "--- host info ---"
      sw_vers
      uname -m
      sysctl kern.hv_support || echo "kern.hv_support unavailable"
      csrutil status || echo "csrutil unavailable"
      echo "--- emulator version ---"
      ~/android_sdk/emulator/emulator -version 2>&1 | head -5 || echo "emulator -version failed"
      echo "--- accel check ---"
      ~/android_sdk/emulator/emulator -accel-check 2>&1 || echo "emulator -accel-check failed (non-zero exit is expected when accel is broken)"
      echo "--- qemu binary ---"
      ls -la ~/android_sdk/emulator/qemu/ 2>&1 || echo "qemu dir not found"
      QEMU_BIN=~/android_sdk/emulator/qemu/darwin-aarch64/qemu-system-aarch64-headless
      file "$QEMU_BIN" 2>&1 || echo "file cmd failed"
      echo "--- xattr ---"
      xattr -l "$QEMU_BIN" 2>&1 || echo "no xattr or binary not found"
      echo "--- codesign entitlements ---"
      codesign -dvvv "$QEMU_BIN" 2>&1 || echo "codesign -dvvv failed"
      echo "--- codesign verify ---"
      codesign --verify --deep "$QEMU_BIN" 2>&1 && echo "signature OK" || echo "signature INVALID"
      echo "=== end HVF diagnostics ==="
  setup-macos-ami-runner:
    - !reference [ .snippets, source-secrets-macos ]
    - !reference [ .snippets, setup-dd-tracer ]
    - !reference [ .snippets, setup-gradle ]
    - !reference [ .snippets, setup-dd-ci-cli ]
    - !reference [ .snippets, install-android-api-components ]
  start-emulator:
    # API 37+ only ships 16 KB-page system images (google_apis_ps16k). Those cannot boot
    # under the forced `-qemu -machine virt` launch: it drops the emulator to TCG software
    # emulation, which aborts on a 16 KB guest (qemu_mprotect__osdep: mprotect failed:
    # Permission denied -> "Abort trap: 6" -> "No online devices found"). Let 16 KB images
    # use the default HVF-accelerated machine (16 KB pages are native on the Apple-Silicon
    # runners) and give the AVD enough RAM/disk to boot. Older/middle APIs (21/23/28) keep
    # the existing `-machine virt` launch untouched. See RUM-16470.
    - |
      EMULATOR_EXTRA_ARGS=(-qemu -machine virt)
      if [[ "$ANDROID_EMULATOR_IMAGE" == *"ps16k"* ]]; then
        EMULATOR_EXTRA_ARGS=(-memory 2048 -partition-size 4096)
      fi
      $ANDROID_HOME/emulator/emulator -avd "$EMULATOR_NAME" -grpc-use-jwt -no-snapstorage -no-audio -no-window -no-boot-anim -verbose "${EMULATOR_EXTRA_ARGS[@]}" &
  run-legacy-integration-instrumented:
    - set +e
    - exit_code=0
    - !reference [ .snippets, start-emulator ]
    - DD_TAGS="test.configuration.android_api:$ANDROID_API" ./gradlew :instrumented:integration:connectedDebugAndroidTest $( (( $ANDROID_API <= 23 )) && echo "-Puse-api21-java-backport -Puse-desugaring" ) || exit_code=$?
    - $ANDROID_HOME/platform-tools/adb emu kill
    - datadog-ci junit upload --service dd-sdk-android --tags test.configuration.android_api:$ANDROID_API --xpath-tag test.suite=/testcase/@classname instrumented/integration/build/outputs/androidTest-results/connected/debug/
    - if [[ "$exit_code" -ne 0 ]]; then exit 1; fi
    - exit 0
  run-core-it-instrumented:
    - set +e
    - exit_code=0
    - !reference [ .snippets, start-emulator ]
    - DD_TAGS="test.configuration.android_api:$ANDROID_API" ./gradlew :reliability:core-it:connectedDebugAndroidTest $( (( $ANDROID_API <= 23 )) && echo "-Puse-api21-java-backport -Puse-desugaring" ) || exit_code=$?
    - $ANDROID_HOME/platform-tools/adb emu kill
    - datadog-ci junit upload --service dd-sdk-android --tags test.configuration.android_api:$ANDROID_API --xpath-tag test.suite=/testcase/@classname reliability/core-it/build/outputs/androidTest-results/connected/debug/
    - if [[ "$exit_code" -ne 0 ]]; then exit 1; fi
    - exit 0
  run-ndk-instrumented:
    - set +e
    - exit_code=0
    - !reference [ .snippets, start-emulator ]
    - DD_TAGS="test.configuration.android_api:$ANDROID_API" ./gradlew :features:dd-sdk-android-ndk:connectedDebugAndroidTest $( (( $ANDROID_API <= 23 )) && echo "-Puse-api21-java-backport -Puse-desugaring" ) || exit_code=$?
    - $ANDROID_HOME/platform-tools/adb emu kill
    - datadog-ci junit upload --service dd-sdk-android --tags test.configuration.android_api:$ANDROID_API --xpath-tag test.suite=/testcase/@classname features/dd-sdk-android-ndk/build/outputs/androidTest-results/connected/debug/
    - if [[ "$exit_code" -ne 0 ]]; then exit 1; fi
    - exit 0
  set-publishing-credentials:
    - !reference [.snippets, source-secrets]
    - export GPG_PRIVATE_KEY=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PRIVATE_KEY)
    - export GPG_PASSWORD=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PASSPHRASE)
    - export CENTRAL_PUBLISHER_USERNAME=$(get_secret $DD_ANDROID_SECRET__PUBLISHING_CENTRAL_USERNAME)
    - export CENTRAL_PUBLISHER_PASSWORD=$(get_secret $DD_ANDROID_SECRET__PUBLISHING_CENTRAL_PWD)
    - export GPG_PUBLIC_FINGERPRINT=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PUBLIC_KEY | gpg --import --import-options show-only | grep -E -o -e "[A-F0-9]{40}")

.base-cache-pull-job:
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - cache/caches/
      - cache/wrapper/
      - cache/notifications/
    policy: pull

# CI IMAGE

ci-image:
  stage: ci-image
  when: manual
  except: [ tags, schedules ]
  tags: [ "arch:amd64" ]
  interruptible: false
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:24.0.4-jammy
  script:
    - docker buildx build --tag $CI_IMAGE_DOCKER -f ./ci/Dockerfile.gitlab --push .

# SECURITY

create_key:
  stage: security
  when: manual
  tags: [ "arch:amd64" ]
  interruptible: false
  variables:
    PROJECT_NAME: "dd-sdk-android"
    EXPORT_TO_KEYSERVER: "true"
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/agent-key-management-tools/gpg:1
  script:
    - /create.sh
  artifacts:
    expire_in: 13 mos
    paths:
      - pubkeys


# STATIC ANALYSIS

static-analysis:
  stage: analysis
  variables:
    DETEKT_PUBLIC_API: "true"
    # Our Detekt tasks can't run in parallel mode
    DETEKT_GENERATE_CLASSPATH_BUILD_TASK: "printSdkDebugRuntimeClasspath --no-parallel"
    DETEKT_CLASSPATH_FILE_PATH: "sdk_classpath"
    FLAVORED_ANDROID_LINT: ":tools:lint:lint"
  trigger:
    include: "https://gitlab-templates.ddbuild.io/mobile/v112054347-9fbe0af8/static-analysis.yml"
    strategy: depend

analysis:detekt-custom:
  extends:
    - .base-cache-pull-job
  tags:
    - "arch:amd64"
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 1h
  script:
    - !reference [.snippets, setup-gradle]
    - ./gradlew unzipAarForDetekt :tools:detekt:jar
    - ./gradlew printDetektClasspath --no-parallel
    - curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
    - ./gradlew customDetektRules

# TODO RUM-1622 cleanup this section
# TESTS

test:debug:
  extends:
    - .base-cache-pull-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test
  timeout: 1h
  script:
    - !reference [.snippets, setup-gradle]
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - >-
        DD_TAGS="test.configuration.variant:debug" ./gradlew
        :dd-sdk-android-core:testDebugUnitTest
        :dd-sdk-android-internal:testDebugUnitTest
        :unitTestDebugFeatures
        :unitTestDebugIntegrations
        :unitTestDebugSamples
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testDebugUnitTest/*.xml"

test:tools:
  extends:
    - .base-cache-pull-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test
  timeout: 1h
  script:
    - !reference [.snippets, setup-gradle]
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - ./gradlew :unitTestTools

test:kover:
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test
  timeout: 1h
  variables:
    GRADLE_CACHE_CLEANUP: "true"
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - cache/caches/
      - cache/wrapper/
      - cache/notifications/
  script:
    - !reference [.snippets, source-secrets]
    - !reference [.snippets, setup-gradle]
    - pip3 install datadog
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - export DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__API_KEY)
    - export DD_APP_KEY=$(get_secret $DD_ANDROID_SECRET__APP_KEY)
    - CODECOV_TOKEN=$(get_secret $DD_ANDROID_SECRET__CODECOV_TOKEN)
    - >-
        DD_TAGS="test.configuration.variant:release" ./gradlew
        :dd-sdk-android-core:koverXmlReportRelease
        :dd-sdk-android-internal:koverXmlReportRelease
        :koverReportFeatures
        :koverReportIntegrations
    - bash <(cat ./ci/scripts/codecov.sh) -t $CODECOV_TOKEN
    - npm install -g @datadog/datadog-ci
    - datadog-ci coverage upload --format=jacoco . || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testReleaseUnitTest/*.xml"

# TEST PYRAMID
# the steps in this section should reflect our test pyramid strategy

test-pyramid:core-it-min-api:
  extends:
    - .base-cache-pull-job
  tags: [ "macos:sonoma", "specific:true" ]
  stage: test-pyramid
  timeout: 1h
  variables:
    ANDROID_API: "23"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API;google_apis;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"
  script:
    - !reference [.snippets, setup-macos-ami-runner]
    - !reference [.snippets, run-core-it-instrumented]

