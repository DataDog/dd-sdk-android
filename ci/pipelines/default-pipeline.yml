include:
  - 'https://gitlab-templates.ddbuild.io/slack-notifier/v3-sdm/template.yml'

# SETUP

default:
  interruptible: true # default all jobs to be interruptable

workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH !~ /^(develop|master)$|^feature\//"
      auto_cancel:
        on_new_commit: interruptible # short-lived branches cancel on new commits
    - when: always # develop, master, feature/*, tags: never auto-canceled
      auto_cancel:
        on_new_commit: none

stages:
  - ci-image
  - security
  - verify
  - test-pyramid
  - publish
  - notify
  - post-release

.snippets:
  source-secrets:
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  setup-gradle:
    - export GRADLE_USER_HOME="cache/"
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - |
      gradle_jvm_args=(
        "-Xmx4096m"
        "-javaagent:$DD_TRACER_FOLDER/dd-java-agent.jar=$DD_COMMON_AGENT_CONFIG"
      )

      gradle_options=(
        "-Dorg.gradle.jvmargs=${gradle_jvm_args[*]}"
        "-Dorg.gradle.logging.stacktrace=all"
      )

      printf -v configured_gradle_options ' %q' "${gradle_options[@]}"
      export GRADLE_OPTS="${GRADLE_OPTS:-}$configured_gradle_options"
      echo "--- GRADLE_OPTS ---"
      echo "$GRADLE_OPTS"

  set-publishing-credentials:
    - !reference [ .snippets, source-secrets ]
    - export GPG_PRIVATE_KEY=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PRIVATE_KEY)
    - export GPG_PASSWORD=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PASSPHRASE)
    - export CENTRAL_PUBLISHER_USERNAME=$(get_secret $DD_ANDROID_SECRET__PUBLISHING_CENTRAL_USERNAME)
    - export CENTRAL_PUBLISHER_PASSWORD=$(get_secret $DD_ANDROID_SECRET__PUBLISHING_CENTRAL_PWD)
    - export GPG_PUBLIC_FINGERPRINT=$(get_secret $DD_ANDROID_SECRET__SIGNING_GPG_PUBLIC_KEY | gpg --import --import-options show-only | grep -E -o -e "[A-F0-9]{40}")

.cpu-memory-intensive-job:
  variables:
    KUBERNETES_MEMORY_REQUEST: 32Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
    KUBERNETES_CPU_REQUEST: 20
    KUBERNETES_CPU_LIMIT: 20

# Embeds the real commit SHA in the SDK. Only for jobs shipping artifacts, since it busts the build cache.
.real-sdk-commit-sha-job:
  variables:
    GRADLE_OPTS: "-DsdkCommitSha1=$CI_COMMIT_SHA"

.base-gradle-cache-job:
  variables:
    CACHE_FALLBACK_KEY: "develop"
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - cache/caches/
      - cache/wrapper/
      - cache/notifications/

# CI IMAGE

ci-image:
  stage: ci-image
  when: manual
  except: [ tags, schedules ]
  tags: [ "arch:amd64" ]
  interruptible: false
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:24.0.4-jammy
  script:
    - METADATA_FILE=$(mktemp)
    - docker buildx build --tag $CI_IMAGE_DOCKER -f ./ci/Dockerfile.gitlab --push --metadata-file ${METADATA_FILE} .
    - ddsign sign $CI_IMAGE_DOCKER --docker-metadata-file ${METADATA_FILE}

# SECURITY

create_key:
  stage: security
  when: manual
  tags: [ "arch:amd64" ]
  interruptible: false
  variables:
    PROJECT_NAME: "dd-sdk-android"
    EXPORT_TO_KEYSERVER: "true"
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/agent-key-management-tools/gpg:1
  script:
    - /create.sh
  artifacts:
    expire_in: 13 mos
    paths:
      - pubkeys

# LINTERS AND TESTS

.verification-gradle-job:
  extends:
    - .base-gradle-cache-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: verify
  timeout: 1h
  cache:
    policy: pull
  before_script:
    - !reference [ .snippets, setup-gradle ]

analysis:generated-files-check:
  extends: .verification-gradle-job
  timeout: 30m
  script:
    - ./gradlew checkGeneratedFiles

analysis:ktlint:
  extends: .verification-gradle-job
  timeout: 30m
  script:
    - ./gradlew ktlintCheck :build-logic:ktlintCheck

analysis:detekt:
  extends: .verification-gradle-job
  script:
    - ./gradlew detekt --continue

analysis:android-lint:
  extends: .verification-gradle-job
  script:
    - ./gradlew :lintCheckAll --continue

test:debug:
  extends: .verification-gradle-job
  script:
    - >-
      DD_TAGS="test.configuration.variant:debug" ./gradlew
      :dd-sdk-android-core:testDebugUnitTest
      :dd-sdk-android-internal:testDebugUnitTest
      :reliability:stub-core:testDebugUnitTest
      :unitTestDebugFeatures
      :unitTestDebugIntegrations
      :unitTestDebugSamples
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testDebugUnitTest/*.xml"

test:tools:
  extends: .verification-gradle-job
  script:
    - ./gradlew :unitTestTools
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "tools/**/build/test-results/test/*.xml"

test:build-logic:
  extends: .verification-gradle-job
  timeout: 30m
  script:
    - ./gradlew :build-logic:test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "build-logic/build/test-results/test/*.xml"

test:kover:
  extends: .verification-gradle-job
  cache:
    policy: pull-push
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  before_script:
    - !reference [ .snippets, source-secrets ]
    - !reference [ .snippets, setup-gradle ]
  script:
    - >-
      DD_TAGS="test.configuration.variant:release" ./gradlew
      --init-script ci/gradle-cache-cleanup.init.gradle.kts
      :dd-sdk-android-core:koverXmlReportRelease
      :dd-sdk-android-internal:koverXmlReportRelease
      :koverReportFeatures
      :koverReportIntegrations
    - dd-sts exchange --policy dd-sdk-android -- datadog-ci coverage upload . || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testReleaseUnitTest/*.xml"

.single-fit-job:
  extends:
    - .base-gradle-cache-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test-pyramid
  needs: []
  timeout: 1h
  cache:
    policy: pull
  before_script:
    - !reference [ .snippets, setup-gradle ]
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testReleaseUnitTest/*.xml"

test:build-instrumented-apks:
  extends: .verification-gradle-job
  script:
    - >-
        ./gradlew
        -Puse-api21-java-backport
        -Puse-desugaring
        :reliability:core-it:assembleDebug
        :reliability:core-it:assembleDebugAndroidTest
        :instrumented:integration:assembleDebug
        :instrumented:integration:assembleDebugAndroidTest
        :features:dd-sdk-android-ndk:assembleDebugAndroidTest
  artifacts:
    expire_in: 1 week
    paths:
      - "reliability/core-it/build/outputs/apk/debug/*.apk"
      - "reliability/core-it/build/outputs/apk/androidTest/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/androidTest/debug/*.apk"
      - "features/dd-sdk-android-ndk/build/outputs/apk/androidTest/debug/*.apk"

test:single-fit-logs:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:logs:testReleaseUnitTest

test:single-fit-rum:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:rum:testReleaseUnitTest

test:single-fit-trace:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:trace:testReleaseUnitTest

test:single-fit-okhttp:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:okhttp:testReleaseUnitTest

test:single-fit-profiling:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:profiling:testReleaseUnitTest

test:single-fit-flags:
  extends: .single-fit-job
  script:
    - DD_TAGS="test.configuration.variant:release" ./gradlew :reliability:single-fit:flags:testReleaseUnitTest

# TEST PYRAMID

test-pyramid:api-coverage:
  extends:
    - .base-gradle-cache-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test-pyramid
  needs: []
  timeout: 1h
  cache:
    policy: pull
  before_script:
    - !reference [ .snippets, setup-gradle ]
  script:
    - ./gradlew checkTestPyramidCoverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/test-pyramid/coverage.txt

.instrumented-apk-job:
  extends: .cpu-memory-intensive-job
  tags: [ "kvm:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: test-pyramid
  needs:
    - job: test:build-instrumented-apks
      artifacts: true
  timeout: 1h
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - instrumentation-output*.txt
      - emulator-*.log
    reports:
      junit: instrumentation-results*.xml

test-pyramid:core-it-and-ndk:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_core_it_and_ndk_apks.py

test-pyramid:legacy-integration-instrumented-min-api:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_legacy_integration_apks.py --api-level 23
  variables:
    INSTRUMENTATION_ARGUMENTS: "-e disableLeakCanary true"

test-pyramid:legacy-integration-instrumented-latest-api:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_legacy_integration_apks.py --api-level 37

test-pyramid:legacy-integration-instrumented-median-api:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_legacy_integration_apks.py --api-level 28

# PUBLISHING

test-pyramid:publish-e2e-synthetics:
  extends:
    - .base-gradle-cache-job
    - .real-sdk-commit-sha-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  cache:
    policy: pull
  stage: test-pyramid
  timeout: 1h
  only:
    - develop
  script:
    - !reference [ .snippets, source-secrets ]
    - mkdir -p ./config/
    - get_secret $DD_ANDROID_SECRET__KEYSTORE | base64 -d > ./sample-android.keystore
    - get_secret $DD_ANDROID_SECRET__E2E_CONFIG_JSON > ./config/us1.json
    - export E2E_STORE_PASSWD=$(get_secret $DD_ANDROID_SECRET__KEYSTORE_PWD)
    - export E2E_DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__E2E_API_KEY)
    - export E2E_DD_APP_KEY=$(get_secret $DD_ANDROID_SECRET__E2E_APP_KEY)
    - export E2E_MOBILE_APP_ID=$(get_secret $DD_ANDROID_SECRET__E2E_MOBILE_APP_ID)
    - !reference [ .snippets, setup-gradle ]
    - DD_API_KEY="$E2E_DD_API_KEY" ./gradlew :sample:kotlin:packageUs1Release
    - datadog-ci synthetics upload-application --appKey "$E2E_DD_APP_KEY" --apiKey "$E2E_DD_API_KEY" --mobileApp "sample/kotlin/build/outputs/apk/us1/release/kotlin-us1-release.apk" --mobileApplicationId "$E2E_MOBILE_APP_ID" --versionName "$CI_COMMIT_SHORT_SHA" --latest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sample/kotlin/build/outputs/apk/us1/release/kotlin-us1-release.apk

test-pyramid:publish-webview-synthetics:
  extends:
    - .base-gradle-cache-job
    - .real-sdk-commit-sha-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  cache:
    policy: pull
  stage: test-pyramid
  timeout: 1h
  only:
    - develop
  script:
    - !reference [ .snippets, source-secrets ]
    - mkdir -p ./config/
    - get_secret $DD_ANDROID_SECRET__KEYSTORE | base64 -d > ./sample-android.keystore
    - get_secret $DD_ANDROID_SECRET__WEBVIEW_CONFIG_JSON > ./config/us1.json
    - export E2E_STORE_PASSWD=$(get_secret $DD_ANDROID_SECRET__KEYSTORE_PWD)
    - export E2E_DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__WEBVIEW_API_KEY)
    - export E2E_DD_APP_KEY=$(get_secret $DD_ANDROID_SECRET__WEBVIEW_APP_KEY)
    - export E2E_MOBILE_APP_ID=$(get_secret $DD_ANDROID_SECRET__WEBVIEW_MOBILE_APP_ID)
    - !reference [ .snippets, setup-gradle ]
    - DD_API_KEY="$E2E_DD_API_KEY" ./gradlew :sample:kotlin:packageUs1Release
    - datadog-ci synthetics upload-application --appKey "$E2E_DD_APP_KEY" --apiKey "$E2E_DD_API_KEY" --mobileApp "sample/kotlin/build/outputs/apk/us1/release/kotlin-us1-release.apk" --mobileApplicationId "$E2E_MOBILE_APP_ID" --versionName "$CI_COMMIT_SHORT_SHA" --latest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sample/kotlin/build/outputs/apk/us1/release/kotlin-us1-release.apk

test-pyramid:publish-staging-synthetics:
  extends:
    - .base-gradle-cache-job
    - .real-sdk-commit-sha-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  cache:
    policy: pull
  stage: test-pyramid
  timeout: 1h
  only:
    - develop
  script:
    - !reference [ .snippets, source-secrets ]
    - mkdir -p ./config/
    - get_secret $DD_ANDROID_SECRET__KEYSTORE | base64 -d > ./sample-android.keystore
    - get_secret $DD_ANDROID_SECRET__E2E_STAGING_CONFIG_JSON > ./config/staging.json
    - export E2E_STORE_PASSWD=$(get_secret $DD_ANDROID_SECRET__KEYSTORE_PWD)
    - export E2E_DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__E2E_STAGING_API_KEY)
    - export E2E_DD_APP_KEY=$(get_secret $DD_ANDROID_SECRET__E2E_STAGING_APP_KEY)
    - export E2E_MOBILE_APP_ID=$(get_secret $DD_ANDROID_SECRET__E2E_STAGING_APP_ID)
    - !reference [ .snippets, setup-gradle ]
    - DD_API_KEY="$E2E_DD_API_KEY" ./gradlew :sample:kotlin:packageStagingRelease
    - datadog-ci synthetics upload-application --appKey "$E2E_DD_APP_KEY" --apiKey "$E2E_DD_API_KEY" --mobileApp "sample/kotlin/build/outputs/apk/staging/release/kotlin-staging-release.apk" --mobileApplicationId "$E2E_MOBILE_APP_ID" --versionName "$CI_COMMIT_SHORT_SHA" --latest --datadogSite "datad0g.com"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sample/kotlin/build/outputs/apk/staging/release/kotlin-staging-release.apk

test-pyramid:publish-benchmark-synthetics:
  extends:
    - .base-gradle-cache-job
    - .real-sdk-commit-sha-job
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  cache:
    policy: pull
  stage: test-pyramid
  timeout: 1h
  only:
    - develop
  script:
    - !reference [ .snippets, source-secrets ]
    - mkdir -p ./config/
    - get_secret $DD_ANDROID_SECRET__KEYSTORE | base64 -d >  ./sample-benchmark.keystore
    - get_secret $DD_ANDROID_SECRET__BENCHMARK_CONFIG_JSON > ./config/benchmark.json
    - export BM_STORE_PASSWD=$(get_secret $DD_ANDROID_SECRET__KEYSTORE_PWD)
    - export BM_DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__BENCHMARK_API_KEY)
    - export BM_DD_APP_KEY=$(get_secret $DD_ANDROID_SECRET__BENCHMARK_APP_KEY)
    - export BM_MOBILE_APP_ID=$(get_secret $DD_ANDROID_SECRET__BENCHMARK_MOBILE_APP_ID)
    - !reference [ .snippets, setup-gradle ]
    - ./gradlew :sample:benchmark:packageRelease
    - datadog-ci synthetics upload-application --appKey "$BM_DD_APP_KEY" --apiKey "$BM_DD_API_KEY" --mobileApp "sample/benchmark/build/outputs/apk/release/benchmark-release.apk" --mobileApplicationId "$BM_MOBILE_APP_ID" --versionName "$CI_COMMIT_SHORT_SHA" --latest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sample/benchmark/build/outputs/apk/release/benchmark-release.apk

test-pyramid:rum-fit-tests:
  stage: test-pyramid
  when: manual
  allow_failure: true
  trigger:
    project: DataDog/rum-sdk-integration-test-framework
    branch: main
    strategy: depend
  variables:
    DYNAMIC_BUILD_RENDER_RULES: android
    TARGET_SHA_DD_SDK_ANDROID: $CI_COMMIT_SHA

# PUBLISH ARTIFACTS ON MAVEN

publish:release-all:
  extends:
    - .cpu-memory-intensive-job
    - .real-sdk-commit-sha-job
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
    - develop
  image: $CI_IMAGE_DOCKER
  stage: publish
  timeout: 30m
  script:
    - !reference [.snippets, set-publishing-credentials]
    - !reference [.snippets, setup-gradle]
    - ./gradlew publishToSonatype closeSonatypeStagingRepository --no-build-cache
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - "**/verification-metadata.xml"

# Publishes every dogfooding build once its pipeline has passed
publish:dogfooding:
  extends:
    - .cpu-memory-intensive-job
    - .real-sdk-commit-sha-job
  tags: [ "arch:amd64" ]
  only:
    - dogfooding
  image: $CI_IMAGE_DOCKER
  stage: publish
  timeout: 30m
  interruptible: false
  script:
    - !reference [.snippets, setup-gradle]
    # Publishing is done by S3 repo, so credentials are managed by IAM from env set in the CI
    # job for the service account. Signing is also not required for internal build.
    - ./gradlew publishReleasePublicationToDogfoodRepository --stacktrace --no-daemon -Pdd-skip-signing


# SLACK NOTIFICATIONS

notify:publish-develop-success:
  extends: .slack-notifier-base
  interruptible: false
  stage: notify
  when: on_success
  only:
    - develop
  script:
    - 'MESSAGE_TEXT=":package: $CI_PROJECT_NAME develop $CI_COMMIT_TAG: Snapshot published on :maven:, Sample app published on :synthetics:"'
    - postmessage "$SLACK_OPS_CHANNEL" "$MESSAGE_TEXT"

notify:publish-develop-failure:
  extends: .slack-notifier-base
  interruptible: false
  stage: notify
  when: on_failure
  only:
    - develop
  script:
    - BUILD_URL="$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID"
    - 'MESSAGE_TEXT=":status_alert: $CI_PROJECT_NAME $CI_COMMIT_TAG develop pipeline <$BUILD_URL|$COMMIT_MESSAGE> failed."'
    - postmessage "$SLACK_OPS_CHANNEL" "$MESSAGE_TEXT"

notify:publish-release-success:
  extends: .slack-notifier-base
  interruptible: false
  stage: notify
  when: on_success
  only:
    - tags
  script:
    - MAVEN_URL="https://search.maven.org/artifact/com.datadoghq/dd-sdk-android-core/$CI_COMMIT_TAG/aar"
    - 'MESSAGE_TEXT=":rocket: $CI_PROJECT_NAME $CI_COMMIT_TAG published on :maven: $MAVEN_URL"'
    - postmessage "$SLACK_OPS_CHANNEL" "$MESSAGE_TEXT"

notify:publish-release-failure:
  extends: .slack-notifier-base
  interruptible: false
  stage: notify
  when: on_failure
  only:
    - tags
  script:
    - BUILD_URL="$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID"
    - 'MESSAGE_TEXT=":status_alert: $CI_PROJECT_NAME $CI_COMMIT_TAG publish pipeline <$BUILD_URL|$COMMIT_MESSAGE> failed."'
    - postmessage "$SLACK_OPS_CHANNEL" "$MESSAGE_TEXT"

notify:dogfood-app:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  stage: notify
  when: on_success
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/datadog-android --policy all.gitlab.pr)
    - pip3 install GitPython requests
    - python3 ./ci/scripts/dogfood.py -v $CI_COMMIT_TAG -t app

notify:dogfood-demo:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  stage: notify
  when: on_success
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/shopist-android --policy all.gitlab.pr)
    - pip3 install GitPython requests
    - python3 ./ci/scripts/dogfood.py -v $CI_COMMIT_TAG -t demo

notify:dogfood-gradle-plugin:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  stage: notify
  when: on_success
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/dd-sdk-android-gradle-plugin --policy all.gitlab.pr)
    - pip3 install GitPython requests
    - python3 ./ci/scripts/dogfood.py -v $CI_COMMIT_TAG -t gradle-plugin

notify:merge-verification-metadata:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  stage: notify
  when: on_success
  dependencies:
    - publish:release-all
  script:
    - python3 ./ci/scripts/merge_verification_metadata.py
  artifacts:
    when: on_success
    expire_in: 3 mos
    paths:
      - verification-metadata.xml

notify:github-release:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  stage: notify
  when: on_success
  needs:
    - notify:merge-verification-metadata
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/dd-sdk-android --policy self.gitlab.release.create-release)
    - >-
        if gh release view "$CI_COMMIT_TAG" --repo DataDog/dd-sdk-android >/dev/null 2>&1; then
          gh release upload "$CI_COMMIT_TAG" --repo DataDog/dd-sdk-android --clobber verification-metadata.xml;
        else
          # Extract out the tag's changelog entry
          start_line=$(grep -Fn "# ${CI_COMMIT_TAG} /" CHANGELOG.md | head -1 | cut -d: -f1 || true);
          if [ -n "$start_line" ]; then
            tail -n "+$((start_line + 1))" CHANGELOG.md | sed -n '/^# /q;p' > release-notes.md || true;
          else
            echo "No CHANGELOG.md entry found for tag $CI_COMMIT_TAG" >&2;
            echo "Fill this in" > release-notes.md;
          fi;
      
          gh release create "$CI_COMMIT_TAG" --repo DataDog/dd-sdk-android --draft --verify-tag --title "$CI_COMMIT_TAG" --notes-file release-notes.md verification-metadata.xml;
        fi

post-release:merge-develop:
  tags: [ "arch:amd64" ]
  interruptible: false
  only:
    - tags
  image: $CI_IMAGE_DOCKER
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  stage: post-release
  when: on_success
  script:
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/dd-sdk-android --policy self.gitlab.release.create-release)
    - bash ./ci/scripts/merge-release-develop.sh "$CI_COMMIT_TAG"
