default:
  interruptible: true

workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH !~ /^(develop|master)$|^feature\//"
    - when: always

stages:
  - verify
  - test-pyramid

.snippets:
  source-secrets:
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  source-secrets-macos:
    - vault login -method=aws -no-print
    - export DD_ANDROID_SECRETS_PATH_PREFIX="kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-android/"
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  setup-dd-tracer:
    - export DD_TRACER_FOLDER="$HOME/dd-java-agent"
    - mkdir -p "$DD_TRACER_FOLDER"
    - curl -Lo "$DD_TRACER_FOLDER/dd-java-agent.jar" https://dtdg.co/latest-java-tracer
    - export DD_API_KEY=$(get_secret $DD_ANDROID_SECRET__API_KEY)
    - export DD_CIVISIBILITY_AGENTLESS_ENABLED=true

  setup-dd-ci-cli:
    - npm install -g @datadog/datadog-ci
    - export DATADOG_API_KEY=$(get_secret $DD_ANDROID_SECRET__API_KEY)

  setup-gradle:
    - export GRADLE_USER_HOME="cache/"
    - echo "org.gradle.jvmargs=-Xmx${GRADLE_JVM_XMX:-4096m} -javaagent:$DD_TRACER_FOLDER/dd-java-agent.jar=$DD_COMMON_AGENT_CONFIG" >> gradle.properties
    # Set max workers to keep memory under control
    - echo "org.gradle.workers.max=${GRADLE_MAX_WORKERS:-8}" >> gradle.properties
    # Disable cache clean up if we won't upload the cache anywhere
    - echo "org.gradle.cache.cleanup=$( [[ "$GRADLE_CACHE_CLEANUP" == "true" ]] && echo "always" || echo "disabled" )" >> gradle.properties
    # Equal to --stacktrace
    - echo "org.gradle.logging.stacktrace=all" >> gradle.properties
    # Keep kotlin compiler in Gradle daemon process for more predictable memory
    - echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
    - echo "--- gradle.properties ---" && cat gradle.properties

  setup-macos-ami-runner:
    - !reference [ .snippets, source-secrets-macos ]
    - !reference [ .snippets, setup-dd-tracer ]
    - !reference [ .snippets, setup-gradle ]
    - !reference [ .snippets, setup-dd-ci-cli ]

.cpu-memory-intensive-job:
  variables:
    KUBERNETES_MEMORY_REQUEST: 32Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_CPU_LIMIT: 16

.verify-all:
  variables:
    GRADLE_JVM_XMX: "8g"
    GRADLE_MAX_WORKERS: "16"
    TRANSFER_METER_FREQUENCY: "1s"
    CACHE_FALLBACK_KEY: ""
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  stage: verify
  timeout: 2h
  script:
    - if [[ -d cache/caches ]]; then du -ah cache/caches | sort -h | tail -100; else echo "No existing Gradle cache"; fi
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - set +e
    - gradle_exit_code=0
    - >-
        DD_TAGS="test.configuration.variant:debug" ./gradlew
        --no-build-cache
        --no-configuration-cache
        --console=plain
        --continue
        --scan
        -Dscan.uploadInBackground=false
        -PverificationBuildType=debug
        -Puse-api21-java-backport
        -Puse-desugaring
        checkGeneratedFiles
        ktlintCheck
        :build-logic:ktlintCheck
        detekt
        lintDebug
        :dd-sdk-android-core:testDebugUnitTest
        :dd-sdk-android-internal:testDebugUnitTest
        :unitTestDebugFeatures
        :unitTestDebugIntegrations
        :sample:benchmark:testDebugUnitTest
        :tools:unit:testJvmDebugUnitTest
        :tools:detekt:test
        :tools:lint:test
        :tools:noopfactory:test
        :tools:benchmark:testDebugUnitTest
        :build-logic:test
        :dd-sdk-android-core:koverXmlReportDebug
        :dd-sdk-android-internal:koverXmlReportDebug
        :koverReportDebugFeatures
        :koverReportDebugIntegrations
        :reliability:single-fit:logs:testDebugUnitTest
        :reliability:single-fit:rum:testDebugUnitTest
        :reliability:single-fit:trace:testDebugUnitTest
        :reliability:single-fit:okhttp:testDebugUnitTest
        :reliability:single-fit:profiling:testDebugUnitTest
        checkTestPyramidCoverage
        :reliability:core-it:assembleDebug
        :reliability:core-it:assembleDebugAndroidTest
        :instrumented:integration:assembleDebug
        :instrumented:integration:assembleDebugAndroidTest
        :features:dd-sdk-android-ndk:assembleDebugAndroidTest
        || gradle_exit_code=$?
    - dd-sts exchange --policy dd-sdk-android -- datadog-ci coverage upload . || true
    - exit "$gradle_exit_code"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "reliability/core-it/build/outputs/apk/debug/*.apk"
      - "reliability/core-it/build/outputs/apk/androidTest/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/androidTest/debug/*.apk"
      - "features/dd-sdk-android-ndk/build/outputs/apk/androidTest/debug/*.apk"
      - "build/reports/test-pyramid/coverage.txt"
    reports:
      junit:
        - "tools/**/build/test-results/test/*.xml"
        - "build-logic/build/test-results/test/*.xml"
        - "**/build/test-results/testDebugUnitTest/*.xml"
        - "reliability/single-fit/**/build/test-results/testDebugUnitTest/*.xml"

verify:all:
  extends:
    - .verify-all
    - .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  cache:
    key: test-debug-3-$CI_COMMIT_REF_SLUG
    paths:
      - cache/caches/
      - cache/wrapper/
      - cache/notifications/
    policy: pull-push
  before_script:
    - !reference [.snippets, source-secrets]
    - !reference [.snippets, setup-gradle]

verify:all_mac:
  extends: .verify-all
  rules:
    - when: never
  tags: [ "macos:sonoma", "specific:true" ]
  before_script:
    - !reference [.snippets, setup-macos-ami-runner]

.instrumented-apk-job:
  rules:
    - when: never
  tags: [ "macos:sonoma", "specific:true" ]
  stage: test-pyramid
  needs:
    - job: verify:all
      artifacts: true
  timeout: 1h
  variables:
    ANDROID_API: "37"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API.0;google_apis_ps16k;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API.0"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - instrumentation-output*.txt
      - emulator-*.log
    reports:
      junit: instrumentation-results*.xml

.legacy-integration-apk-job:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_legacy_integration_apks.py

test-pyramid:core-it:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_core_it_apks.py

test-pyramid:legacy-integration-instrumented-min-api:
  extends: .legacy-integration-apk-job
  variables:
    ANDROID_API: "23"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API;google_apis;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"
    INSTRUMENTATION_ARGUMENTS: "-e disableLeakCanary true"

test-pyramid:legacy-integration-instrumented-latest-api:
  extends: .legacy-integration-apk-job
  variables:
    ANDROID_API: "37"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API.0;google_apis_ps16k;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API.0"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"

test-pyramid:legacy-integration-instrumented-median-api:
  extends: .legacy-integration-apk-job
  variables:
    ANDROID_API: "28"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API;google_apis;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"

test-pyramid:ndk-instrumented-latest-api:
  extends: .instrumented-apk-job
  script:
    - python3 ci/scripts/run_ndk_instrumented_apks.py
  variables:
    ANDROID_API: "37"
    ANDROID_EMULATOR_IMAGE: "system-images;android-$ANDROID_API.0;google_apis_ps16k;${ANDROID_ARCH}"
    ANDROID_PLATFORM: "platforms;android-$ANDROID_API.0"
    ANDROID_BUILD_TOOLS: "build-tools;$ANDROID_API.0.0"
