stages:
  - verify

.snippets:
  source-secrets:
    - source ./ci/scripts/vault_config.sh
    - source ./ci/scripts/get-secret.sh

  setup-gradle:
    - export GRADLE_USER_HOME="cache/"
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - |
      gradle_jvm_args=(
        "-Xmx8g"
        "-javaagent:$DD_TRACER_FOLDER/dd-java-agent.jar=$DD_COMMON_AGENT_CONFIG"
      )

      gradle_options=(
        "-Dorg.gradle.jvmargs=${gradle_jvm_args[*]}"
        "-Dorg.gradle.workers.max=16"
        "-Dorg.gradle.logging.stacktrace=all"
      )

      printf -v configured_gradle_options ' %q' "${gradle_options[@]}"
      export GRADLE_OPTS="${GRADLE_OPTS:-}$configured_gradle_options"
      echo "--- GRADLE_OPTS ---"
      echo "$GRADLE_OPTS"

.cpu-memory-intensive-job:
  variables:
    KUBERNETES_MEMORY_REQUEST: 32Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
    KUBERNETES_CPU_REQUEST: 20
    KUBERNETES_CPU_LIMIT: 20

.experiment-gradle-job:
  extends: .cpu-memory-intensive-job
  variables:
    CACHE_FALLBACK_KEY: ""
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: verify
  timeout: 1h
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - cache/caches/
      - cache/wrapper/
      - cache/notifications/
    policy: pull
  before_script:
    - !reference [ .snippets, source-secrets ]
    - !reference [ .snippets, setup-gradle ]

verify:all:
  extends: .experiment-gradle-job
  parallel: 5
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  script:
    - >-
        DD_TAGS="test.configuration.variant:debug" ./gradlew
        --console=plain
        --continue
        --no-daemon
        --no-build-cache
        --no-configuration-cache
        -DsdkCommitSha1=0000000000000000000000000000000000000000
        -Puse-api21-java-backport
        -Puse-desugaring
        checkGeneratedFiles
        ktlintCheck
        :build-logic:ktlintCheck
        detekt
        lintDebug
        :tools:lint:lint
        :dd-sdk-android-core:testDebugUnitTest
        :dd-sdk-android-internal:testDebugUnitTest
        :unitTestDebugFeatures
        :unitTestDebugIntegrations
        :sample:benchmark:testDebugUnitTest
        :tools:unit:testJvmDebugUnitTest
        :tools:detekt:test
        :tools:lint:test
        :tools:noopfactory:test
        :tools:benchmark:testDebugUnitTest
        :build-logic:test
        :dd-sdk-android-core:koverXmlReportDebug
        :dd-sdk-android-internal:koverXmlReportDebug
        :koverReportDebugFeatures
        :koverReportDebugIntegrations
        :reliability:single-fit:logs:testDebugUnitTest
        :reliability:single-fit:rum:testDebugUnitTest
        :reliability:single-fit:trace:testDebugUnitTest
        :reliability:single-fit:okhttp:testDebugUnitTest
        :reliability:single-fit:profiling:testDebugUnitTest
        :reliability:single-fit:flags:testDebugUnitTest
        checkTestPyramidCoverage
        :reliability:core-it:assembleDebug
        :reliability:core-it:assembleDebugAndroidTest
        :instrumented:integration:assembleDebug
        :instrumented:integration:assembleDebugAndroidTest
        :features:dd-sdk-android-ndk:assembleDebugAndroidTest
    - dd-sts exchange --policy dd-sdk-android -- datadog-ci coverage upload . || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "reliability/core-it/build/outputs/apk/debug/*.apk"
      - "reliability/core-it/build/outputs/apk/androidTest/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/debug/*.apk"
      - "instrumented/integration/build/outputs/apk/androidTest/debug/*.apk"
      - "features/dd-sdk-android-ndk/build/outputs/apk/androidTest/debug/*.apk"
      - "build/reports/test-pyramid/coverage.txt"
    reports:
      junit:
        - "**/build/test-results/test*/*.xml"

experiment:kover:
  extends: .experiment-gradle-job
  parallel: 5
  script:
    - >-
        DD_TAGS="test.configuration.variant:release" ./gradlew
        --console=plain
        --no-daemon
        --no-build-cache
        --no-configuration-cache
        :dd-sdk-android-core:koverXmlReportRelease
        :dd-sdk-android-internal:koverXmlReportRelease
        :koverReportFeatures
        :koverReportIntegrations
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testReleaseUnitTest/*.xml"

experiment:apk-build:
  extends: .experiment-gradle-job
  parallel: 5
  script:
    - >-
        ./gradlew
        --console=plain
        --no-daemon
        --no-build-cache
        --no-configuration-cache
        -Puse-api21-java-backport
        -Puse-desugaring
        :reliability:core-it:assembleDebug
        :reliability:core-it:assembleDebugAndroidTest
        :instrumented:integration:assembleDebug
        :instrumented:integration:assembleDebugAndroidTest
        :features:dd-sdk-android-ndk:assembleDebugAndroidTest

experiment:android-lint:
  extends: .experiment-gradle-job
  parallel: 5
  script:
    - >-
        ./gradlew
        --console=plain
        --continue
        --no-daemon
        --no-build-cache
        --no-configuration-cache
        :lintCheckAll

experiment:detekt:
  extends: .experiment-gradle-job
  parallel: 5
  script:
    - >-
        ./gradlew
        --console=plain
        --continue
        --no-daemon
        --no-build-cache
        --no-configuration-cache
        detekt
