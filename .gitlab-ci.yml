variables:
  CURRENT_CI_IMAGE: "24"
  CI_IMAGE_DOCKER: registry.ddbuild.io/ci/dd-sdk-android:$CURRENT_CI_IMAGE
  GIT_DEPTH: 5

  DD_SERVICE: "dd-sdk-android"
  DD_ENV_TESTS: "ci"
  DD_CIVISIBILITY_ENABLED: "true"
  DD_INSIDE_CI: "true"
  DD_COMMON_AGENT_CONFIG: "dd.env=ci,dd.trace.enabled=false,dd.jmx.fetch.enabled=false"

  KUBERNETES_MEMORY_REQUEST: "8Gi"
  KUBERNETES_MEMORY_LIMIT: "13Gi"

  EMULATOR_NAME: "android_emulator"
  ANDROID_ARCH: "arm64-v8a"
  ANDROID_API: "36"
  ANDROID_SDK_VERSION: "commandlinetools-mac-13114758_latest"

  # Bumped again (RUM-15510 depot-first test) to force a fresh cache so existing
  # google()-attribution metadata from the previous (google-first) configuration does not
  # mask the new depot-first ordering behavior.
  CACHE_FALLBACK_KEY: "develop-magicmirror-v2"

  # Magic Mirror Depot proxy URLs (RUM-15510). The depot proxies both Maven Central and
  # the Gradle Plugin Portal for the Java ecosystem from the same endpoint. Setting these
  # routes dependency/plugin resolution through Datadog's internal mirror to avoid HTTP 429
  # rate-limits from upstream registries.
  # See https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/4199188393/ADMS
  MAVEN_REPOSITORY_PROXY: "https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/"
  GRADLE_PLUGIN_PROXY: "https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/"

include:
  - local: 'ci/pipelines/default-pipeline.yml'
    rules:
      - if: '$CI_PIPELINE_KEY == null'
  - local: 'ci/pipelines/check-release-pipeline.yml'
    rules:
      - if: '$CI_PIPELINE_KEY == "check-release"'
